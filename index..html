function L(k){return t[state.lang][k]||k}
function save(){localStorage.setItem('ca_lang',state.lang);localStorage.setItem('ca_theme',state.theme);localStorage.setItem('ca_favs',JSON.stringify(state.favorites));localStorage.setItem('ca_unit',state.unit);localStorage.setItem('ca_inventory',JSON.stringify(state.inventory))}
function setLang(l){state.lang=l;save();renderNav();render()}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save();document.body.classList.toggle('light',state.theme==='light');$('#themeBtn').textContent=state.theme==='dark'?'☾':'☀';}
function toggleMenu(){$('#mobileMenu').classList.toggle('open')}
function go(path){location.hash=path}
function isFav(id){return state.favorites.includes(id)}
function toggleFav(id,e){if(e)e.stopPropagation();state.favorites=isFav(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()}
function displayName(c){return state.lang==='tr'?c.nameTr:c.name}
function displayDesc(c){return state.lang==='tr'?c.descriptionTr:c.description}
function displayIng(i){return state.lang==='tr'?i.nameTr:i.name}
function iconFor(c){const s=(c.category||[]).join(' ').toLowerCase(); if(s.includes('martini'))return '🍸'; if(s.includes('sparkling'))return '🥂'; if(s.includes('tiki')||s.includes('tropical'))return '🍹'; if(s.includes('highball'))return '🥤'; if(s.includes('non-alcoholic'))return '🧃'; if(s.includes('whiskey'))return '🥃'; return '🍸'}
function cocktailVisual(c,cls='visual'){return `<div class="${cls}" aria-label="${esc(displayName(c))}"><span class="drinkicon">${iconFor(c)}</span></div>`}
function card(c){return `<article class="card" onclick="go('#/cocktail/${encodeURIComponent(c.slug)}')">${cocktailVisual(c)}<button class="heart ${isFav(c.id)?'on':''}" aria-label="favorite" onclick="toggleFav('${esc(c.id)}',event)">${isFav(c.id)?'♥':'♡'}</button><div class="cardbody"><div class="meta">${(c.category||[]).slice(0,2).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}${c.iba?`<span class="tag">IBA</span>`:''}</div><h3>${esc(displayName(c))}</h3><p>${esc(displayDesc(c))}</p><div class="cardfoot"><span>${esc(c.baseSpirit)}</span><span>${c.prepTime||4} ${L('min')}</span></div></div></article>`}
function navItems(){return [['#/',L('home')],['#/cocktails',L('cocktails')],['#/categories',L('categories')],['#/ingredients',L('ingredients')],['#/favorites',L('favorites')]]}
function renderNav(){const items=navItems();const links=items.map(([h,x])=>`<a href="${h}">${x}</a>`).join('');$('#desktopLinks').innerHTML=links;$('#mobileMenu').innerHTML=links;$('#trBtn').classList.toggle('active',state.lang==='tr');$('#enBtn').classList.toggle('active',state.lang==='en');$('#themeBtn').textContent=state.theme==='dark'?'☾':'☀';$('#footerDesc').textContent=state.lang==='tr'?'Dünyanın klasik kokteyllerini keşfet.':'Discover the world’s classic cocktails.';$('#footerLinks').innerHTML=items.map(([h,x])=>`<a href="${h}">${x}</a>`).join('')}
function parseHash(){let h=location.hash||'#/';let [path,...q]=h.slice(2).split('?');return {path:'/'+path,query:new URLSearchParams(q.join('?'))}}
function home(){
 const popular=COCKTAILS.filter(c=>c.isPopular).slice(0,8);
 const classics=COCKTAILS.filter(c=>c.isClassic).slice(0,8);
 return `<div class="wrap"><section class="hero"><div><div class="eyebrow">SHAKE · STIR · DISCOVER</div><h1>Cocktail Atlas</h1><p>${L('hero')}</p><div class="searchbox"><input id="homeSearch" class="input" placeholder="${L('search')}" onkeydown="if(event.key==='Enter')go('#/cocktails?q='+encodeURIComponent(this.value))"><button class="btn primary" onclick="go('#/cocktails?q='+encodeURIComponent($('#homeSearch').value))">${L('explore')}</button></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn" onclick="randomCocktail()">✦ ${L('random')}</button><a class="btn ghost" href="#/ingredients">◈ ${L('homebar')}</a></div></div><div class="hero-visual"><div class="hero-glass">🍸</div><div class="hero-caption"><span>COCKTAIL ATLAS</span><span>EST. 2026</span></div></div></section>
 <section class="section"><div class="sectionhead"><div><h2>${L('popular')}</h2><p>${state.lang==='tr'?'Bar klasiklerinden seçkiler.':'A selection of bar classics.'}</p></div><a class="btn" href="#/cocktails">${L('view')} →</a></div><div class="grid">${popular.map(card).join('')}</div></section>
 <section class="section"><div class="sectionhead"><div><h2>${L('cats')}</h2></div></div><div class="categories">${CATEGORY_NAMES.slice(0,18).map(x=>`<button class="chip" onclick="go('#/cocktails?category='+encodeURIComponent('${esc(x)}'))">${esc(x)}</button>`).join('')}</div></section>

 <section class="section"><div class="sectionhead"><div><h2>${L('classic')}</h2></div></div><div class="grid">${classics.map(card).join('')}</div></section></div>`
}
function cocktailsPage(){
 const qs=parseHash().query; let arr=[...COCKTAILS]; const q=(qs.get('q')||'').trim().toLowerCase(); const cat=qs.get('category')||''; 
 const spirit=qs.get('spirit')||'', meth=qs.get('method')||'', iba=qs.get('iba')||'', diff=qs.get('difficulty')||'', sort=qs.get('sort')||'pop';
 if(q)arr=arr.filter(c=>(displayName(c)+' '+c.name+' '+c.nameTr+' '+c.baseSpirit+' '+c.category.join(' ')+' '+c.ingredients.map(i=>i.name+' '+i.nameTr).join(' ')).toLowerCase().includes(q));
 if(cat)arr=arr.filter(c=>c.category.includes(cat)); if(spirit)arr=arr.filter(c=>c.baseSpirit===spirit); if(meth)arr=arr.filter(c=>c.method.toLowerCase().includes(meth.toLowerCase())); if(iba==='yes')arr=arr.filter(c=>c.iba); if(iba==='no')arr=arr.filter(c=>!c.iba); if(diff)arr=arr.filter(c=>c.difficulty===diff);
 if(sort==='az')arr.sort((a,b)=>displayName(a).localeCompare(displayName(b))); else if(sort==='za')arr.sort((a,b)=>displayName(b).localeCompare(displayName(a))); else if(sort==='rand')arr.sort(()=>Math.random()-.5); else arr.sort((a,b)=>Number(b.isPopular)-Number(a.isPopular));
 const spirits=[...new Set(COCKTAILS.map(c=>c.baseSpirit))].sort(); const methods=[...new Set(COCKTAILS.map(c=>c.method.split(' ')[0]))].sort();
 return `<div class="wrap page"><div class="sectionhead"><div><div class="eyebrow">ATLAS</div><h2>${L('cocktails')}</h2><p>${COCKTAILS.length} ${state.lang==='tr'?'kokteyl keşfetmeye hazır.':'cocktails ready to explore.'}</p></div><button class="btn" onclick="randomCocktail()">✦ ${L('random')}</button></div>
 <input class="input" value="${esc(qs.get('q')||'')}" placeholder="${L('search')}" oninput="if(this.value.length>1||event.inputType==='deleteContentBackward'){clearTimeout(window._search);window._search=setTimeout(()=>go('#/cocktails?q='+encodeURIComponent(this.value)),220)}">
 <div class="filters"><select class="select" onchange="setFilter('spirit',this.value)"><option value="">${L('alcohol')}: ${L('any')}</option>${spirits.map(x=>`<option ${x===spirit?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="select" onchange="setFilter('category',this.value)"><option value="">${L('categories')}: ${L('any')}</option>${CATEGORY_NAMES.map(x=>`<option ${x===cat?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="select" onchange="setFilter('method',this.value)"><option value="">${L('method')}: ${L('any')}</option>${methods.map(x=>`<option ${x===meth?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="select" onchange="setFilter('iba',this.value)"><option value="">${L('iba')}: ${L('any')}</option><option value="yes" ${iba==='yes'?'selected':''}>IBA</option><option value="no" ${iba==='no'?'selected':''}>Non-IBA</option></select><select class="select" onchange="setFilter('difficulty',this.value)"><option value="">${L('difficulty')}: ${L('any')}</option><option value="Easy" ${diff==='Easy'?'selected':''}>${L('easy')}</option><option value="Medium" ${diff==='Medium'?'selected':''}>${L('medium')}</option><option value="Advanced" ${diff==='Advanced'?'selected':''}>${L('advanced')}</option></select><select class="select" onchange="setFilter('sort',this.value)"><option value="pop" ${sort==='pop'?'selected':''}>${L('pop')}</option><option value="az" ${sort==='az'?'selected':''}>${L('az')}</option><option value="za" ${sort==='za'?'selected':''}>${L('za')}</option><option value="rand" ${sort==='rand'?'selected':''}>${L('rand')}</option></select></div>
 <div class="resultbar"><span>${arr.length} ${state.lang==='tr'?'sonuç':'results'}</span><span>${q?`“${esc(q)}”`:''}</span></div>${arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:`<div class="empty"><h2>${L('noResults')}</h2><p>${state.lang==='tr'?'Arama veya filtrelerini değiştirip tekrar dene.':'Try changing your search or filters.'}</p></div>`}</div>`
}
function setFilter(k,v){const qs=parseHash().query;const keys=['q','category','spirit','method','iba','difficulty','sort'];if(v)qs.set(k,v);else qs.delete(k);const s=[...qs.entries()].map(([a,b])=>`${encodeURIComponent(a)}=${encodeURIComponent(b)}`).join('&');go('#/cocktails'+(s?'?'+s:''))}
function categoriesPage(){return `<div class="wrap page"><div class="sectionhead"><div><div class="eyebrow">ATLAS INDEX</div><h2>${L('categories')}</h2><p>${CATEGORY_NAMES.length} ${state.lang==='tr'?'kategori.':'categories.'}</p></div></div><div class="grid">${CATEGORY_NAMES.map(x=>{const n=COCKTAILS.filter(c=>c.category.includes(x)).length;return `<article class="card" style="padding:22px;cursor:pointer" onclick="go('#/cocktails?category='+encodeURIComponent('${esc(x)}'))"><div class="eyebrow">${n} ${state.lang==='tr'?'KOKTEYL':'COCKTAILS'}</div><h3 style="margin:10px 0 0">${esc(x)}</h3><p style="margin-top:8px">${state.lang==='tr'?'Bu kategoriyi keşfet.':'Explore this category.'}</p></article>`}).join('')}</div></div>`}
function favoritesPage(){const arr=COCKTAILS.filter(c=>isFav(c.id));return `<div class="wrap page"><div class="sectionhead"><div><div class="eyebrow">MY ATLAS</div><h2>${L('favorites')}</h2><p>${arr.length} ${state.lang==='tr'?'favori kokteyl':'favorite cocktails'}</p></div></div>${arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:`<div class="empty"><div style="font-size:54px">♡</div><h2>${L('noFavs')}</h2><p>${state.lang==='tr'?'Beğendiğin kokteyllerde kalp ikonuna dokun.':'Tap the heart on cocktails you love.'}</p><a class="btn primary" href="#/cocktails">${L('cocktails')}</a></div>`}</div>`}
function ingredientsPage(){const selected=new Set(state.inventory);let matches=COCKTAILS.map(c=>{const names=c.ingredients.map(i=>i.name.toLowerCase());const have=names.filter(n=>selected.has(n)||[...selected].some(s=>n.includes(s)||s.includes(n))).length;return {...c,have,missing:c.ingredients.length-have,score:c.ingredients.length?have/c.ingredients.length:0}}).filter(x=>x.have>0).sort((a,b)=>b.score-a.score||a.missing-b.missing);return `<div class="wrap page"><div class="sectionhead"><div><div class="eyebrow">HOME BAR</div><h2>${L('homebar')}</h2><p>${L('selectHint')}</p></div></div><div class="inventory">${INGREDIENTS.map(x=>`<button class="chip ${selected.has(x)?'selected':''}" onclick="toggleIngredient('${esc(x)}')">${esc(state.lang==='tr'?(COCKTAILS.flatMap(c=>c.ingredients).find(i=>i.name===x)||{}).nameTr||x:x)}</button>`).join('')}</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin:18px 0"><button class="btn primary" onclick="location.hash='#/ingredients'">${L('find')} (${selected.size})</button><button class="btn" onclick="state.inventory=[];save();render()">${state.lang==='tr'?'Temizle':'Clear'}</button></div><div class="notice">${L('yourIngredients')}: ${selected.size}</div><div style="margin-top:18px">${matches.length?matches.map(matchCard).join(''):`<div class="empty"><h2>${L('noResults')}</h2><p>${state.lang==='tr'?'En az bir malzeme seç ve tekrar dene.':'Select at least one ingredient and try again.'}</p></div>`}</div></div>`}
function toggleIngredient(x){state.inventory=state.inventory.includes(x)?state.inventory.filter(i=>i!==x):[...state.inventory,x];save();render()}
function matchCard(c){const pct=Math.round(c.score*100);return `<article class="match"><div class="matchrow"><div><h3>${esc(displayName(c))}</h3><div style="color:var(--muted);font-size:13px">${c.missing===0?'✓ '+L('ready'):c.missing+' '+L('missing')}</div></div><div class="tag">${pct}% ${L('match')}</div></div><div class="bar"><i style="width:${pct}%"></i></div></article>`}
function detailPage(slug){const c=COCKTAILS.find(x=>x.slug===slug);if(!c)return `<div class="wrap page"><div class="empty"><h2>${L('notFound')}</h2><p>${L('notFoundText')}</p><a class="btn primary" href="#/cocktails">${L('cocktails')}</a></div></div>`;document.title=`${displayName(c)} | Cocktail Atlas`;document.querySelector('meta[name="description"]').setAttribute('content',displayDesc(c));return `<div class="wrap detail"><a class="btn ghost" href="#/cocktails">← ${L('back')}</a><div class="detailhero" style="margin-top:18px"><div>${cocktailVisual(c,'detailvisual')}</div><div><div class="eyebrow">${esc(c.baseSpirit)}</div><h1>${esc(displayName(c))}</h1><p class="lead">${esc(displayDesc(c))}</p><div class="badges">${c.iba?'<span class="tag">IBA</span>':''}${c.isClassic?`<span class="tag">${L('classicLabel')}</span>`:''}${c.isPopular?`<span class="tag">${L('popularLabel')}</span>`:''}${(c.category||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="facts"><div class="fact"><small>${L('difficulty')}</small><strong>${esc(c.difficulty)}</strong></div><div class="fact"><small>${L('prep')}</small><strong>${c.prepTime} ${L('min')}</strong></div><div class="fact"><small>${L('glass')}</small><strong>${esc(c.glass)}</strong></div><div class="fact"><small>${L('method')}</small><strong>${esc(c.method.split(' ')[0])}</strong></div></div><button class="btn primary" onclick="toggleFav('${esc(c.id)}')">${isFav(c.id)?'♥':'♡'} ${L('favorites')}</button></div></div><div class="detailgrid"><section class="panel"><h2>${L('ingredientsTitle')}</h2><div class="measure"><button class="${state.unit==='ml'?'active':''}" onclick="state.unit='ml';save();render()">ml</button><button class="${state.unit==='oz'?'active':''}" onclick="state.unit='oz';save();render()">oz</button></div><div class="ingredients">${c.ingredients.map(i=>`<div class="ingredient"><span>${esc(displayIng(i))}</span><span class="amount">${formatAmount(i.amount,i.unit)}</span></div>`).join('')}</div></section><section class="panel"><h2>${L('prep')}</h2><div class="steps">${steps(c).map((s,i)=>`<div class="step"><span class="num">${i+1}</span><div style="line-height:1.65;color:var(--muted)">${esc(s)}</div></div>`).join('')}</div></section></div><div class="detailgrid"><section class="panel"><h2>${L('history')}</h2><p class="history">${esc(state.lang==='tr'?c.historyTr:c.history)}</p></section><section class="panel"><h2>${state.lang==='tr'?'Servis':'Serve'}</h2><div class="facts" style="grid-template-columns:1fr 1fr"><div class="fact"><small>${L('glass')}</small><strong>${esc(c.glass)}</strong></div><div class="fact"><small>${L('ice')}</small><strong>${esc(c.ice)}</strong></div><div class="fact"><small>${L('garnish')}</small><strong>${esc(c.garnish)}</strong></div><div class="fact"><small>${L('method')}</small><strong>${esc(c.method)}</strong></div></div></section></div></div>`
}
function formatAmount(a,u){if(state.unit==='ml'){return `${a} ${u==='ml'?'ml':u}`} if(u==='dash'||u==='barspoon'||u==='leaves'||u==='whole'||u==='slice'||u==='sprig')return `${a} ${u}`;return `${(a/29.5735).toFixed(a/29.5735%1?1:0)} oz`}
function steps(c){const m=c.method.replace(/\.$/,'');const parts=m.split(/;\s*|\.\s+(?=[A-Z])/).filter(Boolean);return parts.length>1?parts.map(x=>x.trim()+ (/[.!?]$/.test(x)?'':'.')):[m+'.']}
function randomCocktail(){const c=COCKTAILS[Math.floor(Math.random()*COCKTAILS.length)];go('#/cocktail/'+encodeURIComponent(c.slug))}
function render(){const p=parseHash();let out;if(p.path==='/')out=home();else if(p.path==='/cocktails')out=cocktailsPage();else if(p.path==='/categories')out=categoriesPage();else if(p.path==='/ingredients')out=ingredientsPage();else if(p.path==='/favorites')out=favoritesPage();else if(p.path.startsWith('/cocktail/'))out=detailPage(decodeURIComponent(p.path.split('/').slice(2).join('/')));else out=`<div class="wrap page"><div class="empty"><h2>${L('notFound')}</h2><p>${L('notFoundText')}</p><a class="btn primary" href="#/">${L('home')}</a></div></div>`;$('#app').innerHTML=out;window.scrollTo({top:0,behavior:'instant'});renderNav()}
document.body.classList.toggle('light',state.theme==='light');window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',render);
</script>
</body>
</html>
